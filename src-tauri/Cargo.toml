[package]
name = "Meteoric"
version = "2.0.0"
description = "Collects all your games in one place"
authors = ["Nytuo"]
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "protocol-asset", "devtools"] }
serde = { version = "1", features = ["derive"] }
rusqlite = {version = "0.32.1", features = ["bundled"] }
directories = "5.0.1"
serde_json = "1.0.116"
serde_derive = "1.0.198"
libloading = "0.8.3"
tokio = { version = "1.39.2", features = ["full"] }
lazy_static = "1.4.0"
reqwest =  { version = "0.12.11", features = ["json", "stream", "gzip"] }
chrono = "0.4.38"
tracing = "0.1"
url = "2"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1.0"
futures = "0.3"
indicatif = "0.17"
byteorder = "1.5"
hex = "0.4"
uuid = { version = "1.7", features = ["v4"] }
tempfile = "3.5"
scraper = "0.20.0"
regex = "1.10.4"
dotenv = "0.15.0"
steamgriddb_api="0.3.1"
egs-api="0.14.0"
steam-rs="0.4.4"
gog="0.5.0"
csv = "1.3.0"
zip = "2.2.0"
walkdir = "2.5.0"
anyhow = "1.0.92"
clap = "4.5.20"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
once_cell = "1.20.2"
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
image = { version = "0.25", default-features = false, features = ["webp", "gif", "jpeg", "png"] }
webp = "0.3"

[dev-dependencies]
tempfile = "3.5.0"
grcov="0.8.19"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
